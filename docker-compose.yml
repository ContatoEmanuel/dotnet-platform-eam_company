services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eam-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD:-YourStrong@Password123}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - eam-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # API - ASP.NET Core Web API
  api:
    build:
      context: .
      dockerfile: src/3.Presentation/EAM.Web.API/Dockerfile
    container_name: eam-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EAM_DB;User Id=sa;Password=$${DB_PASSWORD:-YourStrong@Password123};TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - eam-network
    restart: unless-stopped

  # Site Institucional - ASP.NET Core MVC
  web-public:
    build:
      context: .
      dockerfile: src/3.Presentation/EAM.Web.Public/Dockerfile
    container_name: eam-web-public
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://api:8080
    ports:
      - "5001:8080"
    depends_on:
      - api
    networks:
      - eam-network
    restart: unless-stopped

  # Portal do Cliente - Blazor Server
  web-portal:
    build:
      context: .
      dockerfile: src/3.Presentation/EAM.Web.Portal/Dockerfile
    container_name: eam-web-portal
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://api:8080
    ports:
      - "5002:8080"
    depends_on:
      - api
    networks:
      - eam-network
    restart: unless-stopped

networks:
  eam-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
