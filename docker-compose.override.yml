version: '3.8'

services:
  sqlserver:
    environment:
      - SA_PASSWORD=Dev@Strong123Pass
    ports:
      - "1433:1433"

  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EAM_DB_Dev;User Id=sa;Password=Dev@Strong123Pass;TrustServerCertificate=True;
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft.AspNetCore=Debug
    ports:
      - "5000:8080"
    volumes:
      - ./src:/app/src:ro

  web-public:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://localhost:5000
      - Logging__LogLevel__Default=Debug
    ports:
      - "5001:8080"
    volumes:
      - ./src:/app/src:ro

  web-portal:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://localhost:5000
      - Logging__LogLevel__Default=Debug
    ports:
      - "5002:8080"
    volumes:
      - ./src:/app/src:ro
